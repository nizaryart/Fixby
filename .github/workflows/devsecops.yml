name: devsecops

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  IMAGE: vulntrack
  TAG: ${{ github.sha }}

jobs:
  tests:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install --require-hashes -r app/requirements.txt && pip install -r requirements-dev.txt
      - run: make test

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install -r ci/semgrep.txt
      - name: Scan the code (custom rules are tested first)
        run: |
          mkdir -p reports
          make sast 2>&1 | tee reports/semgrep.txt
      - name: Report
        if: always()
        run: |
          { echo '### Semgrep'; echo '```'; tail -n 40 reports/semgrep.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  secrets:
    name: Secrets (gitleaks, full history)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: scripts/install-tools.sh gitleaks
      - run: make secrets

  iac:
    name: IaC and config (Terraform, Helm, Trivy, Ansible)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: scripts/install-tools.sh trivy terraform helm actionlint
      - run: pip install -r ci/ansible.txt
      - name: Lint and scan the infrastructure code
        run: |
          mkdir -p reports
          make iac 2>&1 | tee reports/iac.txt
      - name: Report
        if: always()
        run: |
          {
            echo '### Misconfigurations (all severities, gate = HIGH and CRITICAL)'
            echo '```'
            .tools/bin/trivy config --quiet --helm-set image.tag=ci --skip-dirs .tools . || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make build IMAGE="$IMAGE" TAG="$TAG"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image
          path: image.tar
          retention-days: 1

  image-scan:
    name: Image scan and SBOM (Trivy)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
      - run: scripts/install-tools.sh trivy
      - name: Fail on fixable HIGH or CRITICAL vulnerabilities
        run: |
          mkdir -p reports
          make image-scan 2>&1 | tee reports/image-scan.txt
      - name: Generate the SBOM
        if: always()
        run: make sbom
      - name: Report
        if: always()
        run: |
          { echo '### Image vulnerabilities (fixable HIGH and CRITICAL)'; echo '```'; cat reports/image-scan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sbom-and-reports
          path: |
            sbom.cdx.json
            reports/

  deploy:
    name: Deploy to kind (PSA restricted, token from Vault)
    needs: [tests, sast, secrets, iac, image-scan]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      vault:
        image: hashicorp/vault:2.2.2@sha256:dfa48c2fa2b0099ccb47681ec5c4804bf5aec9d6879ecfee07ad4b92a5427ad6
        env:
          VAULT_DEV_ROOT_TOKEN_ID: ci-dev-root
          VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
        ports:
          - 8200:8200
        options: >-
          --cap-add=IPC_LOCK
          --health-cmd "vault status -address=http://127.0.0.1:8200"
          --health-interval 2s
          --health-retries 30
    env:
      VAULT_ADDR: http://127.0.0.1:8200
      VAULT_TOKEN: ci-dev-root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
      - run: scripts/install-tools.sh kind kubectl helm
      - name: Store the API token in Vault (plays the role of the ops team)
        run: |
          token="$(openssl rand -hex 32)"
          echo "::add-mask::$token"
          curl -sf -o /dev/null -H "X-Vault-Token: $VAULT_TOKEN" -X POST \
            -d "{\"data\":{\"token\":\"$token\"}}" "$VAULT_ADDR/v1/secret/data/vulntrack/api"
      - name: Read the API token from Vault
        run: |
          token="$(curl -sf -H "X-Vault-Token: $VAULT_TOKEN" "$VAULT_ADDR/v1/secret/data/vulntrack/api" \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["data"]["data"]["token"])')"
          echo "::add-mask::$token"
          echo "VULNTRACK_TOKEN=$token" >> "$GITHUB_ENV"
      - name: Deploy the scanned image
        run: make deploy TAG="$TAG"
      - name: Smoke test
        run: make smoke
      - name: Data survives a restart
        run: make persistence
      - name: Diagnostics
        if: failure()
        run: |
          kubectl get all,pvc,events -n vulntrack || true
          kubectl -n vulntrack describe pods || true
          kubectl -n vulntrack logs deployment/vulntrack --all-containers || true

  harden:
    name: Ansible hardening (applied twice to the runner)
    needs: iac
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: infra/ansible
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install -r ../../ci/ansible.txt
      - name: First run applies the hardening
        run: ansible-playbook -i localhost, -c local harden.yml -e harden_full_upgrade=false
      - name: Second run must change nothing
        run: |
          ansible-playbook -i localhost, -c local harden.yml -e harden_full_upgrade=false | tee second-run.log
          grep -Eq 'changed=0 +unreachable=0 +failed=0' second-run.log
      - name: Check the result from outside Ansible
        run: |
          sshd_config="$(sudo sshd -T)"
          firewall="$(sudo ufw status)"
          grep -x 'passwordauthentication no' <<<"$sshd_config"
          grep -x 'permitrootlogin no' <<<"$sshd_config"
          grep -x 'Status: active' <<<"$firewall"
          systemctl is-active fail2ban
