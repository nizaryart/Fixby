# GitLab equivalent of .github/workflows/devsecops.yml.
# Deploys to the k3s node built by infra/terraform + infra/ansible; reads the API token from Vault with a GitLab OIDC token.
stages: [test, scan, build, verify, publish, deploy]

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

default:
  interruptible: true

variables:
  TAG: $CI_COMMIT_SHA
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

.debian-tools:
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends ca-certificates curl git make unzip > /dev/null

.docker:
  image: docker:29.10.1
  services:
    - docker:29.10.1-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"

unit-tests:
  stage: test
  image: python:3.13-slim-trixie
  script:
    - pip install --require-hashes -r app/requirements.txt
    - pip install -r requirements-dev.txt
    - python -m pytest -q

semgrep:
  stage: scan
  image: python:3.13-slim-trixie
  extends: .debian-tools
  script:
    - pip install -r ci/semgrep.txt
    - make sast

gitleaks:
  stage: scan
  image:
    name: ghcr.io/gitleaks/gitleaks:v8.30.1
    entrypoint: [""]
  variables:
    GIT_DEPTH: "0"
  script:
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - gitleaks git --redact --no-banner -v .

iac:
  stage: scan
  image: python:3.13-slim-trixie
  extends: .debian-tools
  script:
    - scripts/install-tools.sh trivy terraform helm actionlint
    - pip install -r ci/ansible.txt
    - make iac

build:
  stage: build
  extends: .docker
  script:
    - docker build --label org.opencontainers.image.revision="$TAG" -t "vulntrack:$TAG" .
    - docker save -o image.tar "vulntrack:$TAG"
  artifacts:
    paths: [image.tar]
    expire_in: 1 day

image-scan:
  stage: verify
  needs: [build]
  image:
    name: aquasec/trivy:0.76.2
    entrypoint: [""]
  script:
    - trivy image --input image.tar --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed
    - trivy image --input image.tar --format cyclonedx --output sbom.cdx.json
  artifacts:
    when: always
    paths: [sbom.cdx.json]

publish:
  stage: publish
  extends: .docker
  needs: [build, image-scan, unit-tests, semgrep, gitleaks, iac]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - docker load -i image.tar
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker tag "vulntrack:$TAG" "$CI_REGISTRY_IMAGE:$TAG"
    - docker push "$CI_REGISTRY_IMAGE:$TAG"

deploy-lab:
  stage: deploy
  needs: [publish]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
  environment:
    name: lab
  image: alpine/k8s:1.37.2
  id_tokens:
    VAULT_ID_TOKEN:
      aud: vulntrack-deploy
  script:
    - |
      VAULT_TOKEN="$(curl -sf -X POST -d "{\"role\":\"vulntrack-deploy\",\"jwt\":\"$VAULT_ID_TOKEN\"}" \
        "$VAULT_ADDR/v1/auth/jwt/login" | jq -re .auth.client_token)"
      export VAULT_TOKEN
    - |
      VULNTRACK_TOKEN="$(curl -sf -H "X-Vault-Token: $VAULT_TOKEN" "$VAULT_ADDR/v1/secret/data/vulntrack/api" \
        | jq -re .data.data.token)"
    - |
      printf '%s' "$VULNTRACK_TOKEN" \
        | kubectl -n vulntrack create secret generic vulntrack-api --from-file=token=/dev/stdin --dry-run=client -o yaml \
        | kubectl apply -f -
    - |
      helm upgrade --install vulntrack helm/vulntrack --namespace vulntrack \
        --set image.repository="$CI_REGISTRY_IMAGE" --set image.tag="$TAG" \
        --set imagePullSecrets[0].name=gitlab-registry --wait --timeout 3m
