apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vulntrack.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "vulntrack.selector" . | nindent 6 }}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - ports:
        - port: 8000
          protocol: TCP
  egress: []
