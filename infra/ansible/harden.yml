---
- name: Harden an Ubuntu host before it joins the cluster
  hosts: all
  become: true
  vars:
    harden_full_upgrade: true
    harden_allowed_tcp_ports: []
    harden_ssh_service: ssh
    harden_sysctl:
      net.ipv4.conf.all.accept_redirects: 0
      net.ipv4.conf.default.accept_redirects: 0
      net.ipv4.conf.all.send_redirects: 0
      net.ipv4.conf.all.log_martians: 1
      net.ipv4.tcp_syncookies: 1
      kernel.kptr_restrict: 2
      kernel.dmesg_restrict: 1

  tasks:
    - name: Install the security packages
      ansible.builtin.apt:
        name:
          - openssh-server
          - ufw
          - fail2ban
          - python3-systemd
          - unattended-upgrades
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Apply pending package upgrades
      ansible.builtin.apt:
        upgrade: safe
      when: harden_full_upgrade | bool

    - name: Ensure the sshd privilege separation directory exists
      ansible.builtin.file:
        path: /run/sshd
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Restrict SSH to key-based logins
      ansible.builtin.template:
        src: templates/sshd-hardening.conf.j2
        dest: /etc/ssh/sshd_config.d/10-hardening.conf
        owner: root
        group: root
        mode: "0644"
        validate: /usr/sbin/sshd -t -f %s
      notify: Restart ssh

    - name: Validate the complete SSH configuration
      ansible.builtin.command: /usr/sbin/sshd -t
      changed_when: false

    - name: Deny incoming traffic by default
      community.general.ufw:
        direction: incoming
        default: deny

    - name: Allow outgoing traffic by default
      community.general.ufw:
        direction: outgoing
        default: allow

    - name: Allow SSH with rate limiting
      community.general.ufw:
        rule: limit
        port: "22"
        proto: tcp

    - name: Allow the other administration ports
      community.general.ufw:
        rule: allow
        port: "{{ item | string }}"
        proto: tcp
      loop: "{{ harden_allowed_tcp_ports }}"

    - name: Enable the firewall
      community.general.ufw:
        state: enabled

    - name: Ban repeated SSH failures
      ansible.builtin.template:
        src: templates/fail2ban-sshd.local.j2
        dest: /etc/fail2ban/jail.d/sshd.local
        owner: root
        group: root
        mode: "0644"
      notify: Restart fail2ban

    - name: Keep fail2ban running
      ansible.builtin.service:
        name: fail2ban
        state: started
        enabled: true

    - name: Install security updates automatically
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";
        owner: root
        group: root
        mode: "0644"

    - name: Harden kernel network settings
      ansible.posix.sysctl:
        name: "{{ item.key }}"
        value: "{{ item.value | string }}"
        sysctl_file: /etc/sysctl.d/60-hardening.conf
        reload: true
      loop: "{{ harden_sysctl | dict2items }}"

    - name: Read the effective SSH configuration
      ansible.builtin.command: /usr/sbin/sshd -T
      register: harden_sshd_effective
      changed_when: false

    - name: Check that password and root logins are off
      ansible.builtin.assert:
        that:
          - "'passwordauthentication no' in harden_sshd_effective.stdout_lines"
          - "'permitrootlogin no' in harden_sshd_effective.stdout_lines"
          - "'kbdinteractiveauthentication no' in harden_sshd_effective.stdout_lines"
        fail_msg: Another sshd_config.d file overrides the hardening drop-in.

  handlers:
    - name: Restart ssh
      ansible.builtin.service:
        name: "{{ harden_ssh_service }}"
        state: restarted

    - name: Restart fail2ban
      ansible.builtin.service:
        name: fail2ban
        state: restarted
